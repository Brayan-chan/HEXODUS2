      <section class="section gallery" id="galeria">
        <div class="wrap">
          <div class="section-index reveal"><span>05</span> Galería</div>
          <div class="section-head">
            <h2 class="reveal reveal--clip">
              Así se vive<br /><em>entrenar aquí.</em>
            </h2>
            <p class="reveal">
              Una mirada a las áreas de fuerza, maquinaria y ambiente que
              encontrarás en Hexodus.
            </p>
          </div>
          <div class="facility-gallery" data-facility-gallery>
            <figure class="facility-stage reveal">
              <picture
                ><source
                  media="(max-width: 600px)"
                  srcset="/assets/gallery-main-900.webp" />
                <img
                  src="/assets/gallery-main-1800.webp"
                  alt="Sala principal de Hexodus"
                  loading="lazy"
                  decoding="async"
                  width="1800"
                  height="1200"
                  data-gallery-image
              /></picture>
              <figcaption>
                <div>
                  <small data-gallery-kicker>Espacios Hexodus</small
                  ><strong data-gallery-caption>Sala principal</strong>
                </div>
                <span data-gallery-count>01 / 03</span>
              </figcaption>
            </figure>
            <div
              class="facility-controls reveal"
              role="group"
              aria-label="Seleccionar fotografía de instalaciones"
            >
              <button
                class="facility-thumb is-active"
                type="button"
                aria-pressed="true"
                data-desktop="/assets/gallery-main-1800.webp"
                data-mobile="/assets/gallery-main-900.webp"
                data-alt="Sala principal de Hexodus"
                data-caption="Sala principal"
                data-count="01 / 03"
              >
                <img
                  src="/assets/gallery-main-900.webp"
                  alt=""
                  loading="lazy"
                  decoding="async"
                /><span><b>01</b>Sala principal</span>
              </button>
              <button
                class="facility-thumb"
                type="button"
                aria-pressed="false"
                data-desktop="/assets/gallery-strength-1800.webp"
                data-mobile="/assets/gallery-strength-900.webp"
                data-alt="Atleta entrenando en maquinaria Hexodus"
                data-caption="Zona de fuerza"
                data-count="02 / 03"
              >
                <img
                  src="/assets/gallery-strength-900.webp"
                  alt=""
                  loading="lazy"
                  decoding="async"
                /><span><b>02</b>Zona de fuerza</span>
              </button>
              <button
                class="facility-thumb"
                type="button"
                aria-pressed="false"
                data-desktop="/assets/gallery-machines-1800.webp"
                data-mobile="/assets/gallery-machines-900.webp"
                data-alt="Maquinaria profesional de Hexodus"
                data-caption="Maquinaria"
                data-count="03 / 03"
              >
                <img
                  src="/assets/gallery-machines-900.webp"
                  alt=""
                  loading="lazy"
                  decoding="async"
                /><span><b>03</b>Maquinaria</span>
              </button>
            </div>
          </div>
        </div>
      </section>

<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>html, body { background: #080a0f; }</style>
    <link
      rel="icon"
      type="image/png"
      sizes="140x140"
      href="/assets/hexodus-icon.png"
    />
    <script>
      document.documentElement.classList.add("has-js");
      if (location.hash && location.hash !== "#inicio") {
        document.documentElement.classList.add("has-deep-link");
      }
    </script>
    <title>{{ seo.title }}</title>
    <meta name="description" content="{{ seo.description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <meta name="robots" content="{{ robots }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="{{ seo.title }}" />
    <meta property="og:description" content="{{ seo.description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:image" content="{{ socialImage }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/assets/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/barlow-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/barlow-condensed-latin-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/main.css" />
    {% block pageStyles %}{% endblock %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ExerciseGym",
      "name": "{{ site.name }}",
      "description": "{{ seo.description }}",
      "url": "{{ canonical }}",
      "image": "{{ socialImage }}",
      "telephone": "{{ site.phoneE164 }}",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "San Francisco de Campeche",
        "addressRegion": "Campeche",
        "addressCountry": "MX"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "05:00",
          "closes": "23:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday"],
          "opens": "07:00",
          "closes": "15:00"
        }
      ],
      "priceRange": "$$"
    }
    </script>
    <script type="module" src="/{{ route.entry }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    {% include "components/header.html" %}
    {% include "components/promo.html" %}
    <main id="contenido">{% block content %}{% endblock %}</main>
    {% include "components/footer.html" %}
  </body>
</html>

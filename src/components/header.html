<header class="site-header" data-header>
  <a class="brand" href="{% if route.id == 'home' %}#inicio{% else %}/{% endif %}" aria-label="{{ site.name }}, inicio">
    <img src="/assets/hexodus.png" alt="Hexodus" /><small>FITNESS CENTER</small>
  </a>
  <nav class="desktop-nav" aria-label="Navegación principal">
    {% for item in site.navigation %}<a href="{% if item.path %}{{ item.path }}{% elif route.id == 'home' %}#{{ item.anchor }}{% else %}/#{{ item.anchor }}{% endif %}"{% if item.path == route.path %} class="is-active" aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
  </nav>
  <a class="button button--primary header-cta" href="{{ site.headerCta.href or site.whatsappUrl }}" target="_blank" rel="noopener noreferrer">{{ site.headerCta.label or "Inscríbete ahora" }} <span>↗</span></a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Abrir menú" data-menu-toggle>
    <span></span><span></span><span></span>
  </button>
</header>
<nav class="mobile-menu" id="mobile-menu" data-menu aria-label="Navegación móvil">
  {% for item in site.navigation %}<a href="{% if item.path %}{{ item.path }}{% elif route.id == 'home' %}#{{ item.anchor }}{% else %}/#{{ item.anchor }}{% endif %}"{% if item.path == route.path %} class="is-active" aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
</nav>
